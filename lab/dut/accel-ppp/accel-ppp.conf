# accel-ppp as a Phase 0 reference DUT — PPPoE over QinQ, PAP/CHAP via RADIUS,
# IPv4 pool, IPv6 (IPv6CP + RA + DHCPv6-PD).
#
# A starting point, not a tuned BNG: check every option against the
# accel-ppp version you run (accel-pppd -V) and its man page accel-ppp.conf(5).
# Interface names and addresses match lab/topology.md; replace them.

[modules]
log_file
pppoe
auth_pap
auth_chap_md5
radius
ippool
ipv6pool
ipv6_nd
ipv6_dhcp
sigchld
pppd_compat

[core]
log-error=/var/log/accel-ppp/core.log
thread-count=8

[common]
single-session=replace
# 0 = no limit on sessions in setup at once; a limit here caps TS-04 results.
max-starting=0

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
ipv4=require
ipv6=allow
ipv6-intf-id=0:0:0:1
ipv6-peer-intf-id=0:0:0:2
ipv6-accept-peer-intf-id=1
lcp-echo-interval=30
lcp-echo-failure=3
unit-cache=1000

[pppoe]
verbose=1
ac-name=bngload-lab-ac
# QinQ: S-VLAN interfaces ens2f0.100 … ens2f0.199 must exist (see README.md);
# vlan-mon creates the C-VLAN interfaces on the first PADI (needs the
# accel-ppp vlan_mon kernel module).
vlan-mon=re:^ens2f0\.1[0-9][0-9]$,1-4000
vlan-timeout=60
vlan-name=%I.%N
interface=re:^ens2f0\.1[0-9][0-9]\.[0-9]+$
# Untagged or single-tagged instead:
#interface=ens2f0
padi-limit=0

[radius]
dictionary=/usr/local/share/accel-ppp/radius/dictionary
nas-identifier=accel-ppp-01
nas-ip-address=192.0.2.1
gw-ip-address=100.64.0.1
server=192.0.2.10,testing123,auth-port=1812,acct-port=1813,req-limit=0,fail-time=0
dae-server=192.0.2.1:3799,testing123
verbose=1
timeout=3
max-try=3
acct-timeout=120
acct-interim-interval=0

[ip-pool]
gw-ip-address=100.64.0.1
100.64.0.0/14

[ipv6-pool]
fc00:0:1::/48,64
delegate=fc00:1::/40,56

[ipv6-nd]
AdvManagedFlag=1
AdvOtherConfigFlag=1

[ipv6-dhcp]
verbose=1
pref-lifetime=604800
valid-lifetime=2592000
route-via-gw=1

[dns]
dns1=192.0.2.53
dns2=192.0.2.54

[log]
log-file=/var/log/accel-ppp/accel-ppp.log
log-emerg=/var/log/accel-ppp/emerg.log
copy=1
level=3

[cli]
verbose=1
telnet=127.0.0.1:2000
tcp=127.0.0.1:2001
