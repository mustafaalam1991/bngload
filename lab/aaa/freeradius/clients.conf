# FreeRADIUS 3.2 clients for the Phase 0 lab (append to /etc/freeradius/3.0/clients.conf).
# One block per DUT. Use a long random secret per DUT outside throwaway labs.

client accel-ppp-01 {
	ipaddr = 192.0.2.1
	secret = testing123
	shortname = accel-ppp-01
	nas_type = other
	# Reject Access-Requests without Message-Authenticator (BlastRADIUS,
	# CVE-2024-3596 mitigation). Every DUT in scope should send it; if one
	# does not, that is worth recording as a finding.
	require_message_authenticator = yes
	limit_proxy_state = yes
}
